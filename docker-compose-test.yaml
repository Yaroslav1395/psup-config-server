services:
  config-server:
    image: psup-config/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=test
    networks:
      - config-server-net
      - psup-shared-net

networks:
  config-server-net:
    driver: bridge
  psup-shared-net:
    external: true